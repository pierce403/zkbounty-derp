name: Client CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: ./scripts/test-check-generated-frontend.sh
        working-directory: .
      - run: ./build-front.sh
        working-directory: .
      - run: ./scripts/check-generated-frontend.sh
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
